<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZYNTRA | Planner</title>

<style>
:root{
    --bg:#070711;
    --bg2:#0d0d1b;
    --purple:#8b5cf6;
    --blue:#3b82f6;
    --pink:#ec4899;
    --cyan:#06b6d4;
    --green:#22c55e;
    --red:#ef4444;
    --orange:#f59e0b;
    --text:#f5f5f5;
    --muted:#999;
    --border:rgba(255,255,255,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            rgba(139,92,246,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at top right,
            rgba(59,130,246,.10),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);
}


/* =====================================================
   NAVBAR
   ===================================================== */

.navbar{
    height:70px;

    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    background:
        rgba(7,7,17,.88);

    backdrop-filter:blur(15px);

    border-bottom:
        1px solid var(--border);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    text-decoration:none;
    color:white;
}

.brand-icon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    font-size:19px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:8px;
}

.nav-links a{
    color:#aaa;

    text-decoration:none;

    padding:10px 12px;

    border-radius:10px;

    font-size:14px;

    transition:.2s;
}

.nav-links a:hover,
.nav-links a.active{
    color:white;

    background:
        rgba(139,92,246,.12);
}

.profile{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:white;

    font-weight:bold;

    text-decoration:none;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );
}


/* =====================================================
   MAIN
   ===================================================== */

.container{
    width:94%;
    max-width:1150px;

    margin:auto;

    padding:40px 0 70px;
}


/* =====================================================
   HEADER
   ===================================================== */

.header{
    text-align:center;

    margin-bottom:30px;
}

.header h1{
    font-size:42px;

    margin-bottom:10px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--blue),
            var(--cyan)
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header p{
    color:var(--muted);
}


/* =====================================================
   SUMMARY
   ===================================================== */

.summary{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;
}

.summary-card{
    padding:20px;

    border:
        1px solid var(--border);

    background:
        rgba(13,13,27,.82);

    border-radius:18px;

    text-align:center;

    transition:.2s;
}

.summary-card:hover{
    transform:translateY(-3px);

    border-color:
        rgba(139,92,246,.3);
}

.summary-number{
    font-size:28px;

    font-weight:bold;

    margin-bottom:5px;
}

.summary-label{
    color:#999;

    font-size:13px;
}


/* =====================================================
   LAYOUT
   ===================================================== */

.planner-layout{
    display:grid;

    grid-template-columns:
        330px 1fr;

    gap:20px;
}


/* =====================================================
   CARD
   ===================================================== */

.card{
    background:
        rgba(13,13,27,.85);

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.20);
}

.card h2{
    font-size:18px;

    margin-bottom:18px;
}


/* =====================================================
   FORM
   ===================================================== */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    color:#bbb;

    font-size:13px;
}

input,
select,
textarea{
    width:100%;

    background:#090916;

    color:white;

    border:
        1px solid var(--border);

    border-radius:11px;

    padding:12px;

    outline:none;

    font-family:Arial,sans-serif;

    transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--purple);

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,.08);
}

textarea{
    min-height:80px;

    resize:vertical;
}

select option{
    background:#101021;
}

.add-btn{
    width:100%;

    border:none;

    padding:13px;

    border-radius:11px;

    color:white;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    transition:.2s;
}

.add-btn:hover{
    transform:translateY(-2px);
}


/* =====================================================
   FILTERS
   ===================================================== */

.filters{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:18px;
}

.filter-btn{
    padding:8px 13px;

    border-radius:20px;

    border:
        1px solid var(--border);

    background:transparent;

    color:#aaa;

    cursor:pointer;

    transition:.2s;
}

.filter-btn:hover,
.filter-btn.active{
    background:
        rgba(139,92,246,.15);

    color:white;

    border-color:var(--purple);
}


/* =====================================================
   TASK
   ===================================================== */

.task{
    display:flex;

    align-items:flex-start;

    gap:13px;

    padding:17px;

    border:
        1px solid var(--border);

    background:#0b0b19;

    border-radius:15px;

    margin-bottom:12px;

    transition:.2s;
}

.task:hover{
    border-color:
        rgba(139,92,246,.3);

    transform:translateY(-1px);
}

.task.completed{
    opacity:.55;
}

.task.completed .task-title{
    text-decoration:line-through;
}

.check{
    width:21px;
    height:21px;

    margin-top:2px;

    cursor:pointer;

    accent-color:var(--purple);
}

.task-info{
    flex:1;

    min-width:0;
}

.task-title{
    font-weight:bold;

    margin-bottom:7px;

    word-break:break-word;
}

.task-description{
    color:#999;

    font-size:13px;

    margin-bottom:9px;

    line-height:1.5;

    word-break:break-word;
}

.task-meta{
    display:flex;

    flex-wrap:wrap;

    gap:7px;
}

.badge{
    padding:5px 8px;

    border-radius:10px;

    font-size:11px;

    background:
        rgba(59,130,246,.12);

    color:#9dbdff;
}

.badge.subject{
    background:
        rgba(139,92,246,.12);

    color:#c2adff;
}

.badge.high{
    background:
        rgba(239,68,68,.12);

    color:#ff9b9b;
}

.badge.medium{
    background:
        rgba(245,158,11,.12);

    color:#ffd083;
}

.badge.low{
    background:
        rgba(34,197,94,.12);

    color:#86e8aa;
}

.delete-btn{
    border:none;

    background:transparent;

    color:#777;

    cursor:pointer;

    font-size:18px;

    padding:3px 5px;

    transition:.2s;
}

.delete-btn:hover{
    color:var(--red);

    transform:scale(1.1);
}


/* =====================================================
   EMPTY
   ===================================================== */

.empty{
    text-align:center;

    padding:45px 15px;

    color:#777;
}

.empty-icon{
    font-size:40px;

    margin-bottom:12px;
}


/* =====================================================
   MESSAGE
   ===================================================== */

.message{
    display:none;

    padding:12px;

    margin-bottom:15px;

    border-radius:11px;

    text-align:center;

    font-size:13px;
}

.message.show{
    display:block;
}

.message.success{
    color:#86e8aa;

    background:
        rgba(34,197,94,.10);

    border:
        1px solid
        rgba(34,197,94,.20);
}

.message.error{
    color:#ff9b9b;

    background:
        rgba(239,68,68,.10);

    border:
        1px solid
        rgba(239,68,68,.20);
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:850px){

    .planner-layout{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr;
    }

    .nav-links{
        display:none;
    }

    .header h1{
        font-size:34px;
    }

    .container{
        width:94%;
    }
}
</style>
</head>

<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar">

    <a href="index.html" class="brand">

        <div class="brand-icon">
            Z
        </div>

        <span class="logo">
            ZYNTRA
        </span>

    </a>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="study.html">
            Study
        </a>

        <a href="ai.html">
            AI
        </a>

        <a href="community.html">
            Community
        </a>

        <a
            href="planner.html"
            class="active"
        >
            Planner
        </a>

        <a href="challenge.html">
            Challenges
        </a>

    </div>


    <a
        href="profile.html"
        class="profile"
        id="profileInitial"
        title="My Profile"
    >
        S
    </a>

</nav>


<!-- =====================================================
     MAIN
     ===================================================== -->

<main class="container">


    <div class="header">

        <h1>
            Study Planner
        </h1>

        <p id="welcomeText">
            Organize your studies and stay on track.
        </p>

    </div>


    <!-- =================================================
         SUMMARY
         ================================================= -->

    <section class="summary">

        <div class="summary-card">

            <div
                class="summary-number"
                id="totalTasks"
            >
                0
            </div>

            <div class="summary-label">
                Total Tasks
            </div>

        </div>


        <div class="summary-card">

            <div
                class="summary-number"
                id="pendingTasks"
            >
                0
            </div>

            <div class="summary-label">
                Pending
            </div>

        </div>


        <div class="summary-card">

            <div
                class="summary-number"
                id="completedTasks"
            >
                0
            </div>

            <div class="summary-label">
                Completed
            </div>

        </div>

    </section>


    <!-- =================================================
         PLANNER
         ================================================= -->

    <div class="planner-layout">


        <!-- =================================================
             ADD TASK
             ================================================= -->

        <section class="card">

            <h2>
                ➕ Add Study Task
            </h2>


            <div
                class="message"
                id="formMessage"
            ></div>


            <div class="form-group">

                <label for="taskTitle">
                    Task
                </label>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="e.g. Revise Trigonometry"
                    maxlength="100"
                >

            </div>


            <div class="form-group">

                <label for="taskSubject">
                    Subject
                </label>

                <select id="taskSubject">

                    <option value="Mathematics">
                        Mathematics
                    </option>

                    <option value="Chemistry">
                        Chemistry
                    </option>

                    <option value="Physics">
                        Physics
                    </option>

                    <option value="Biology">
                        Biology
                    </option>

                    <option value="Computer">
                        Computer Studies
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="Kiswahili">
                        Kiswahili
                    </option>

                    <option value="Geography">
                        Geography
                    </option>

                    <option value="History">
                        History
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="taskDate">
                    Date
                </label>

                <input
                    type="date"
                    id="taskDate"
                >

            </div>


            <div class="form-group">

                <label for="taskPriority">
                    Priority
                </label>

                <select id="taskPriority">

                    <option value="High">
                        High
                    </option>

                    <option
                        value="Medium"
                        selected
                    >
                        Medium
                    </option>

                    <option value="Low">
                        Low
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="taskDescription">
                    Notes
                </label>

                <textarea
                    id="taskDescription"
                    placeholder="Add some notes..."
                    maxlength="500"
                ></textarea>

            </div>


            <button
                type="button"
                class="add-btn"
                id="addTaskButton"
            >
                Add to Planner
            </button>

        </section>


        <!-- =================================================
             TASK LIST
             ================================================= -->

        <section class="card">

            <h2>
                📚 My Study Tasks
            </h2>


            <div class="filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="pending"
                >
                    Pending
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>


            <div id="taskList"></div>

        </section>

    </div>

</main>


<!-- =====================================================
     AUTH SYSTEM
     ===================================================== -->

<script src="auth.js"></script>


<script>

/* =====================================================
   REQUIRE LOGIN
   ===================================================== */

if(!requireZyntraLogin()){

    throw new Error(
        "ZYNTRA login required."
    );

}


/* =====================================================
   ELEMENTS
   ===================================================== */

const profileInitial =
    document.getElementById(
        "profileInitial"
    );

const welcomeText =
    document.getElementById(
        "welcomeText"
    );

const taskTitle =
    document.getElementById(
        "taskTitle"
    );

const taskSubject =
    document.getElementById(
        "taskSubject"
    );

const taskDate =
    document.getElementById(
        "taskDate"
    );

const taskPriority =
    document.getElementById(
        "taskPriority"
    );

const taskDescription =
    document.getElementById(
        "taskDescription"
    );

const taskList =
    document.getElementById(
        "taskList"
    );

const formMessage =
    document.getElementById(
        "formMessage"
    );


/* =====================================================
   USER
   ===================================================== */

const studentName =
    getZyntraName();

const studentEmail =
    getZyntraEmail();

const studentUsername =
    getZyntraUsername();


/* =====================================================
   PROFILE INITIAL
   ===================================================== */

const firstLetter =
    studentName
        .trim()
        .charAt(0)
        .toUpperCase() ||
    "S";

profileInitial.textContent =
    firstLetter;


/* =====================================================
   WELCOME MESSAGE
   ===================================================== */

welcomeText.textContent =
    "Welcome " +
    studentName +
    "! Organize your studies and stay on track.";


/* =====================================================
   USER-SPECIFIC STORAGE
   ===================================================== */

function getPlannerKey(){

    const identifier =
        studentUsername ||
        studentEmail ||
        studentName ||
        "student";

    return (
        "zyntraPlanner_" +
        identifier
    );

}


/* =====================================================
   GET TASKS
   ===================================================== */

function getTasks(){

    try{

        const saved =
            localStorage.getItem(
                getPlannerKey()
            );

        if(!saved){
            return [];
        }

        const tasks =
            JSON.parse(saved);

        return Array.isArray(tasks)
            ? tasks
            : [];

    }catch(error){

        console.error(
            "ZYNTRA planner error:",
            error
        );

        return [];

    }

}


/* =====================================================
   SAVE TASKS
   ===================================================== */

function saveTasks(tasks){

    localStorage.setItem(
        getPlannerKey(),
        JSON.stringify(tasks)
    );

}


/* =====================================================
   CURRENT FILTER
   ===================================================== */

let currentFilter =
    "all";


/* =====================================================
   FORM MESSAGE
   ===================================================== */

function showMessage(
    message,
    type
){

    formMessage.textContent =
        message;

    formMessage.className =
        "message show " +
        type;


    setTimeout(
        function(){

            formMessage.className =
                "message";

        },
        2500
    );

}


/* =====================================================
   ADD TASK
   ===================================================== */

function addTask(){

    const title =
        taskTitle.value.trim();

    const subject =
        taskSubject.value;

    const date =
        taskDate.value;

    const priority =
        taskPriority.value;

    const description =
        taskDescription.value.trim();


    if(!title){

        showMessage(
            "Please enter a study task.",
            "error"
        );

        taskTitle.focus();

        return;

    }


    const tasks =
        getTasks();


    const newTask = {

        id:
            Date.now().toString(),

        title:
            title,

        subject:
            subject,

        date:
            date,

        priority:
            priority,

        description:
            description,

        completed:
            false,

        createdAt:
            new Date().toISOString()

    };


    tasks.unshift(
        newTask
    );


    saveTasks(
        tasks
    );


    /* Clear form */

    taskTitle.value =
        "";

    taskDate.value =
        "";

    taskDescription.value =
        "";


    showMessage(
        "✓ Study task added successfully.",
        "success"
    );


    renderTasks();

}


/* =====================================================
   RENDER TASKS
   ===================================================== */

function renderTasks(){

    const tasks =
        getTasks();


    let filteredTasks =
        tasks;


    if(
        currentFilter ===
        "pending"
    ){

        filteredTasks =
            tasks.filter(
                task =>
                    !task.completed
            );

    }


    if(
        currentFilter ===
        "completed"
    ){

        filteredTasks =
            tasks.filter(
                task =>
                    task.completed
            );

    }


    updateSummary(
        tasks
    );


    if(
        filteredTasks.length ===
        0
    ){

        let message =
            "No study tasks yet.";


        if(
            currentFilter ===
            "pending"
        ){

            message =
                "No pending tasks.";

        }


        if(
            currentFilter ===
            "completed"
        ){

            message =
                "No completed tasks yet.";

        }


        taskList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📖
                </div>

                ${message}

                <br>

                ${
                    currentFilter === "all"
                    ?
                    "Add your first task to begin planning."
                    :
                    "Your tasks will appear here."
                }

            </div>

        `;

        return;

    }


    taskList.innerHTML =
        "";


    filteredTasks.forEach(
        task => {

            const taskElement =
                document.createElement(
                    "div"
                );


            taskElement.className =
                "task" +
                (
                    task.completed
                    ?
                    " completed"
                    :
                    ""
                );


            taskElement.innerHTML = `

                <input
                    class="check"
                    type="checkbox"
                    ${
                        task.completed
                        ?
                        "checked"
                        :
                        ""
                    }
                    aria-label="Complete task"
                >


                <div class="task-info">

                    <div class="task-title">
                        ${escapeHTML(task.title)}
                    </div>


                    ${
                        task.description
                        ?
                        `
                        <div class="task-description">
                            ${escapeHTML(task.description)}
                        </div>
                        `
                        :
                        ""
                    }


                    <div class="task-meta">

                        <span class="badge subject">
                            ${escapeHTML(task.subject)}
                        </span>


                        ${
                            task.date
                            ?
                            `
                            <span class="badge">
                                📅 ${formatDate(task.date)}
                            </span>
                            `
                            :
                            ""
                        }


                        <span
                            class="badge ${String(task.priority).toLowerCase()}"
                        >
                            ${escapeHTML(task.priority)}
                        </span>

                    </div>

                </div>


                <button
                    type="button"
                    class="delete-btn"
                    title="Delete task"
                    aria-label="Delete task"
                >
                    🗑
                </button>

            `;


            /* Checkbox */

            const checkbox =
                taskElement.querySelector(
                    ".check"
                );


            checkbox.addEventListener(
                "change",
                function(){

                    toggleTask(
                        task.id
                    );

                }
            );


            /* Delete */

            const deleteButton =
                taskElement.querySelector(
                    ".delete-btn"
                );


            deleteButton.addEventListener(
                "click",
                function(){

                    deleteTask(
                        task.id
                    );

                }
            );


            taskList.appendChild(
                taskElement
            );

        }
    );

}


/* =====================================================
   TOGGLE TASK
   ===================================================== */

function toggleTask(id){

    const tasks =
        getTasks();


    const task =
        tasks.find(
            item =>
                item.id === id
        );


    if(!task){
        return;
    }


    task.completed =
        !task.completed;


    saveTasks(
        tasks
    );


    renderTasks();

}


/* =====================================================
   DELETE TASK
   ===================================================== */

function deleteTask(id){

    const confirmed =
        confirm(
            "Delete this study task?"
        );


    if(!confirmed){
        return;
    }


    let tasks =
        getTasks();


    tasks =
        tasks.filter(
            task =>
                task.id !== id
        );


    saveTasks(
        tasks
    );


    renderTasks();

}


/* =====================================================
   FILTER
   ===================================================== */

document
    .querySelectorAll(
        ".filter-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    currentFilter =
                        this.dataset.filter;


                    document
                        .querySelectorAll(
                            ".filter-btn"
                        )
                        .forEach(
                            btn => {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    renderTasks();

                }
            );

        }
    );


/* =====================================================
   ADD BUTTON
   ===================================================== */

document
    .getElementById(
        "addTaskButton"
    )
    .addEventListener(

/* =====================================================
   ENTER KEY
   ===================================================== */

taskTitle.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            addTask();

        }

    }
);


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary(
    tasks
){

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            task =>
                task.completed
        ).length;


    const pending =
        total -
        completed;


    document.getElementById(
        "totalTasks"
    ).textContent =
        total;


    document.getElementById(
        "pendingTasks"
    ).textContent =
        pending;


    document.getElementById(
        "completedTasks"
    ).textContent =
        completed;

}


/* =====================================================
   DATE
   ===================================================== */

function formatDate(
    date
){

    if(!date){
        return "";
    }


    const parts =
        date.split("-");


    if(
        parts.length !==
        3
    ){

        return date;

    }


    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
